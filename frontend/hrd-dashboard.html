<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recruitment Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --base: #12181B;
    --surface: #1B2327;
    --surface-hover: #212B2F;
    --border: #2A3438;
    --text: #E4E9EA;
    --muted: #8A9599;
    --accent: #4FB0A8;
    --accent-dim: rgba(79,176,168,0.14);
    --reject: #B0664F;
    --reject-dim: rgba(176,102,79,0.14);
    --hold: #C9A24F;
    --hold-dim: rgba(201,162,79,0.14);
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--base); color: var(--text);
    font-family: var(--font-body); font-size: 14px; line-height: 1.5;
    min-height: 100vh;
  }
  ::selection { background: var(--accent); color: var(--base); }

  /* ---------- Password gate ---------- */
  #gate {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--base); z-index: 100;
  }
  #gate .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 36px 32px; width: 320px;
  }
  #gate h1 {
    font-family: var(--font-display); font-size: 18px; margin: 0 0 4px;
  }
  #gate p { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  #gate input {
    width: 100%; background: var(--base); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 6px; font-family: var(--font-mono);
    font-size: 13px; margin-bottom: 12px;
  }
  #gate input:focus { outline: none; border-color: var(--accent); }
  #gate button, .btn {
    width: 100%; background: var(--accent); color: #0C1213; border: none;
    padding: 10px 12px; border-radius: 6px; font-weight: 600; cursor: pointer;
    font-family: var(--font-body); font-size: 13px; transition: opacity .15s;
  }
  #gate button:hover { opacity: 0.88; }
  #gateError { color: var(--reject); font-size: 12px; margin-top: 10px; display: none; }

  /* ---------- Shell ---------- */
  #app { display: none; max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }
  header.top {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 22px; flex-wrap: wrap; gap: 8px;
  }
  header.top h1 {
    font-family: var(--font-display); font-size: 22px; font-weight: 600; margin: 0;
    letter-spacing: -0.01em;
  }
  header.top .count { color: var(--muted); font-size: 13px; font-family: var(--font-mono); }
  .refresh-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: var(--font-body);
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .logout-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: var(--font-body);
  }
  .logout-btn:hover { border-color: var(--reject); color: var(--reject); }

  /* ---------- Filter bar ---------- */
  .filterbar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  .pill {
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    padding: 6px 14px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
    transition: all .15s; font-family: var(--font-body); font-weight: 500;
  }
  .pill.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .search {
    margin-left: auto; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 7px 12px; border-radius: 6px; font-size: 13px; width: 200px;
    font-family: var(--font-body);
  }
  .search:focus { outline: none; border-color: var(--accent); }

  /* ---------- Layout ---------- */
  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }

  .list-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    max-height: 76vh; overflow-y: auto;
  }
  .row {
    padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
    transition: background .12s; display: flex; flex-direction: column; gap: 5px;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--surface-hover); }
  .row.selected { background: var(--accent-dim); border-left: 2px solid var(--accent); padding-left: 14px; }
  .row-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .row-name { font-weight: 600; font-size: 13.5px; }
  .row-position { color: var(--muted); font-size: 12px; }
  .row-bottom { display: flex; justify-content: space-between; align-items: center; }
  .score { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .badge {
    font-size: 10.5px; padding: 2px 9px; border-radius: 999px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.03em; font-family: var(--font-body);
  }
  .badge.shortlist { background: var(--accent-dim); color: var(--accent); }
  .badge.reject { background: var(--reject-dim); color: var(--reject); }
  .badge.hold { background: var(--hold-dim); color: var(--hold); }

  .empty-list { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ---------- Detail panel ---------- */
  .detail {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 26px; min-height: 76vh; animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .detail-empty {
    display: flex; align-items: center; justify-content: center; height: 76vh;
    color: var(--muted); font-size: 13px; text-align: center; flex-direction: column; gap: 10px;
  }
  .detail-empty svg { opacity: 0.35; }

  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .detail h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 2px; }
  .detail .sub { color: var(--muted); font-size: 13px; }
  .detail-id { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 4px; }

  .section { margin-top: 24px; }
  .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
    font-weight: 600; margin-bottom: 10px;
  }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .fact-box { background: var(--base); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .fact-box .k { font-size: 10.5px; color: var(--muted); margin-bottom: 3px; }
  .fact-box .v { font-size: 13px; font-weight: 500; }

  .skills-text { font-size: 13px; line-height: 1.6; color: var(--text); }

  /* GitHub tech-stack language bar (signature element) */
  .lang-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 10px; background: var(--base); }
  .lang-bar span { height: 100%; }
  .lang-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; }
  .lang-legend .item { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .lang-legend .dot { width: 8px; height: 8px; border-radius: 2px; }
  .no-github {
    font-size: 13px; color: var(--muted); background: var(--base); border: 1px dashed var(--border);
    border-radius: 8px; padding: 14px; font-style: italic;
  }
  .frameworks { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .frameworks code { font-family: var(--font-mono); background: var(--base); padding: 2px 6px; border-radius: 4px; color: var(--accent); }

  .briefing-box {
    background: var(--base); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px;
  }
  .briefing-box p { margin: 0; font-size: 13.5px; line-height: 1.75; color: var(--text); }
  .questions { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
  .questions ol { margin: 0; padding-left: 22px; }
  .questions li {
    font-size: 13.5px; line-height: 1.6; margin-bottom: 12px; padding-left: 4px;
  }
  .questions li:last-child { margin-bottom: 0; }
  .questions li::marker { color: var(--accent); font-weight: 600; }

  code, .mono { font-family: var(--font-mono); }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>Recruitment Dashboard</h1>
    <p>Internal use only — enter your access key to continue.</p>
    <input type="password" id="gateInput" placeholder="Access key" autofocus>
    <button onclick="unlockDashboard()">Open Dashboard</button>
    <div id="gateError">Wrong key, try again.</div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div>
      <h1>Recruitment Dashboard</h1>
      <div class="count" id="candidateCount">— candidates</div>
    </div>
    <div class="header-actions">
      <button class="refresh-btn" onclick="loadCandidates()">↻ Refresh</button>
      <button class="logout-btn" onclick="logout()">Log out</button>
    </div>
  </header>

  <div class="filterbar">
    <div class="pill active" data-filter="all" onclick="setFilter('all')">All</div>
    <div class="pill" data-filter="shortlist" onclick="setFilter('shortlist')">Shortlist</div>
    <div class="pill" data-filter="hold" onclick="setFilter('hold')">On Hold</div>
    <div class="pill" data-filter="reject" onclick="setFilter('reject')">Rejected</div>
    <input class="search" id="searchInput" placeholder="Search name / position..." oninput="renderList()">
  </div>

  <div class="grid">
    <div class="list-panel" id="listPanel"></div>
    <div id="detailPanel">
      <div class="detail-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <div>Select a candidate from the list to see details</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ====== CONFIG ======
  const CANDIDATES_WEBHOOK = 'https://YOUR-N8N-DOMAIN/webhook/get-candidates'; // TODO: ganti dengan URL production kamu

  // ====== State ======
  let allCandidates = [];
  let currentFilter = 'all';
  let selectedId = null;

  const LANG_COLORS = {
    Python: '#3572A5', JavaScript: '#f1e05a', TypeScript: '#3178c6', PHP: '#4F5D95',
    Java: '#b07219', Go: '#00ADD8', Ruby: '#701516', HTML: '#e34c26', CSS: '#563d7c',
    'C++': '#f34b7d', C: '#555555', Shell: '#89e051', Rust: '#dea584'
  };
  function langColor(lang) { return LANG_COLORS[lang] || '#6b7680'; }

  // ====== Auth gate ======
  function unlockDashboard() {
    const val = document.getElementById('gateInput').value.trim();
    if (!val) return;
    localStorage.setItem('dashboardKey', val);
    tryEnter();
  }
  document.getElementById('gateInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') unlockDashboard();
  });

  function logout() {
    localStorage.removeItem('dashboardKey');
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('gateInput').value = '';
    document.getElementById('gateError').style.display = 'none';
  }

  async function tryEnter() {
    const key = localStorage.getItem('dashboardKey');
    if (!key) return;
    try {
      const res = await fetch(CANDIDATES_WEBHOOK, { headers: { 'X-Dashboard-Key': key } });
      if (!res.ok) throw new Error('unauthorized');
      const data = await res.json();
      allCandidates = normalizeData(data);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      renderList();
    } catch (err) {
      localStorage.removeItem('dashboardKey');
      document.getElementById('gateError').style.display = 'block';
    }
  }

  function normalizeData(raw) {
    return (Array.isArray(raw) ? raw : []).map(item => {
      const j = item.json || item; // tolerate either shape
      let languages = {};
      let frameworks = [];
      try { languages = JSON.parse(j['GitHub Tech Stack']?.split('|')[0].replace('Frameworks:', '').trim() || '{}'); } catch(e) {}
      try {
        const fw = j['GitHub Tech Stack']?.split('Frameworks:')[1];
        frameworks = fw ? JSON.parse(fw.trim()) : [];
      } catch(e) {}
      return {
        id: j['Candidate ID'] || '',
        name: j['Name'] || 'Unknown',
        position: j['Position'] || '—',
        experience: j['Experience'] || '—',
        education: j['Education'] || '—',
        skills: j['Skills'] || '—',
        previousCompanies: j['Previous Companies'] || '—',
        score: j['AI Score'] || '',
        recommendation: (j['Recommendation'] || '').toLowerCase(),
        status: j['Status'] || '',
        githubUsername: j['GitHub Username'] || '',
        githubLastActivity: j['GitHub Last Activity'] || '',
        languages, frameworks,
        discrepancy: j['Interviewer Discrepancy Notes'] || '',
        questions: j['Suggested Follow-up Questions'] || '',
        timestamp: j['Timestamp'] || ''
      };
    });
  }

  function statusOf(c) {
    if (c.recommendation.includes('shortlist')) return 'shortlist';
    if (c.recommendation.includes('hold')) return 'hold';
    return 'reject';
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.filter === f));
    renderList();
  }

function extractScoreNumber(raw) {
    const text = String(raw);
    const scoreMatch = text.match(/Score:\s*(\d{1,3})/i);
    if (scoreMatch) return scoreMatch[1];
    const anyMatch = text.match(/\d{1,3}/);
    return anyMatch ? anyMatch[0] : '—';
  }

  function renderList() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allCandidates.filter(c => {
      const matchesFilter = currentFilter === 'all' || statusOf(c) === currentFilter;
      const matchesSearch = !q || c.name.toLowerCase().includes(q) || c.position.toLowerCase().includes(q);
      return matchesFilter && matchesSearch;
    });

    document.getElementById('candidateCount').textContent = `${allCandidates.length} candidates total · ${filtered.length} shown`;

    const panel = document.getElementById('listPanel');
    if (filtered.length === 0) {
      panel.innerHTML = `<div class="empty-list">No matching candidates.</div>`;
      return;
    }
    panel.innerHTML = filtered.map(c => {
      const st = statusOf(c);
      const badgeLabel = st === 'shortlist' ? 'Shortlist' : st === 'hold' ? 'On Hold' : 'Reject';
      return `
        <div class="row ${c.id === selectedId ? 'selected' : ''}" onclick="selectCandidate('${c.id}')">
          <div class="row-top">
            <div class="row-name">${escapeHtml(c.name)}</div>
            <span class="badge ${st}">${badgeLabel}</span>
          </div>
          <div class="row-position">${escapeHtml(c.position)}</div>
          <div class="row-bottom">
            <span class="score">Score: ${extractScoreNumber(c.score)}</span>
          </div>
        </div>`;
    }).join('');
  }

  function selectCandidate(id) {
    selectedId = id;
    renderList();
    const c = allCandidates.find(x => x.id === id);
    if (!c) return;
    renderDetail(c);
  }

  function renderDetail(c) {
    const st = statusOf(c);
    const badgeLabel = st === 'shortlist' ? 'Shortlist' : st === 'hold' ? 'On Hold' : 'Reject';

    let githubSection;
    const langEntries = Object.entries(c.languages || {});
    const totalBytes = langEntries.reduce((s, [,v]) => s + v, 0);

    if (!c.githubUsername || langEntries.length === 0) {
      githubSection = `<div class="no-github">GitHub not found / not listed on the CV — verify technical skills directly during the interview.</div>`;
    } else {
      const bar = langEntries.map(([lang, bytes]) => {
        const pct = totalBytes ? (bytes / totalBytes * 100).toFixed(1) : 0;
        return `<span style="width:${pct}%; background:${langColor(lang)}"></span>`;
      }).join('');
      const legend = langEntries.sort((a,b) => b[1]-a[1]).map(([lang, bytes]) => {
        const pct = totalBytes ? (bytes / totalBytes * 100).toFixed(1) : 0;
        return `<div class="item"><span class="dot" style="background:${langColor(lang)}"></span>${escapeHtml(lang)} · ${pct}%</div>`;
      }).join('');
      const fw = (c.frameworks || []).length
        ? `<div class="frameworks">Detected manifests: ${c.frameworks.map(f => `<code>${escapeHtml(f)}</code>`).join(' ')}</div>`
        : '';
      githubSection = `
        <div class="lang-bar">${bar}</div>
        <div class="lang-legend">${legend}</div>
        ${fw}
        <div style="margin-top:10px; font-size:12px; color:var(--muted)">
          @${escapeHtml(c.githubUsername)} · last activity: ${c.githubLastActivity ? new Date(c.githubLastActivity).toLocaleDateString('id-ID') : '—'}
        </div>`;
    }

    document.getElementById('detailPanel').innerHTML = `
      <div class="detail">
        <div class="detail-header">
          <div>
            <h2>${escapeHtml(c.name)}</h2>
            <div class="sub">${escapeHtml(c.position)}</div>
          </div>
          <span class="badge ${st}">${badgeLabel}</span>
        </div>
        <div class="detail-id">ID ${escapeHtml(c.id)} · ${c.timestamp ? new Date(c.timestamp).toLocaleString('id-ID') : ''}</div>

        <div class="section">
          <div class="section-label">CV Summary</div>
          <div class="facts">
            <div class="fact-box"><div class="k">Experience</div><div class="v">${escapeHtml(String(c.experience))} years</div></div>
            <div class="fact-box"><div class="k">Education</div><div class="v">${escapeHtml(c.education)}</div></div>
            <div class="fact-box"><div class="k">Previous Companies</div><div class="v">${escapeHtml(c.previousCompanies)}</div></div>
          </div>
        </div>

        <div class="section">
          <div class="section-label">Skills (CV claims)</div>
          <div class="skills-text">${escapeHtml(c.skills)}</div>
        </div>

        <div class="section">
          <div class="section-label">GitHub Tech Stack</div>
          ${githubSection}
        </div>

        <div class="section">
          <div class="section-label">Interviewer Notes</div>
          <div class="briefing-box">
            <p>${escapeHtml(c.discrepancy) || 'No notes yet (briefing may still be running in the background).'}</p>
            ${c.questions ? `<div class="questions"><div class="section-label" style="margin-top:16px">Suggested Follow-up Questions</div>${formatQuestions(c.questions)}</div>` : ''}
          </div>
        </div>
      </div>`;
  }

  function formatQuestions(text) {
    // Handles "1. ...", "1) ...", or newline-separated question lists from the LLM.
    // Try splitting on a numbered marker first (with or without a preceding newline).
    let items = text.split(/\s*\n?\s*\d+[\.\)]\s+/).map(s => s.trim()).filter(Boolean);
    // Fall back to splitting on plain newlines if no numbering was found.
    if (items.length <= 1) {
      items = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
    }
    if (items.length <= 1) return `<p style="margin-top:8px">${escapeHtml(text)}</p>`;
    return `<ol>${items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ol>`;
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  async function loadCandidates() {
    const key = localStorage.getItem('dashboardKey');
    if (!key) return;
    const res = await fetch(CANDIDATES_WEBHOOK, { headers: { 'X-Dashboard-Key': key } });
    const data = await res.json();
    allCandidates = normalizeData(data);
    renderList();
    if (selectedId) {
      const c = allCandidates.find(x => x.id === selectedId);
      if (c) renderDetail(c);
    }
  }

  // ====== Init ======
  tryEnter();
</script>
</body>
</html>
